<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300">
  <!-- Горячий источник: каменный бортик и вода. Рисуется за Капи и друзьями. -->
  <!-- тень под бассейном -->
  <rect x="10" y="22" width="680" height="272" rx="120" fill="#000000" opacity="0.10"/>
  <!-- каменный бортик -->
  <rect x="6" y="10" width="688" height="276" rx="124" fill="#a8937c"/>
  <rect x="10" y="10" width="680" height="266" rx="120" fill="#c9b8a3"/>
  <!-- камни по краю -->
  <g fill="#d8c9b5">
    <ellipse cx="80" cy="44" rx="34" ry="16"/><ellipse cx="170" cy="22" rx="40" ry="13"/>
    <ellipse cx="280" cy="18" rx="44" ry="12"/><ellipse cx="400" cy="18" rx="46" ry="12"/>
    <ellipse cx="520" cy="22" rx="40" ry="13"/><ellipse cx="616" cy="42" rx="34" ry="16"/>
    <ellipse cx="34" cy="140" rx="16" ry="34"/><ellipse cx="666" cy="140" rx="16" ry="34"/>
    <ellipse cx="90" cy="252" rx="36" ry="14"/><ellipse cx="610" cy="252" rx="36" ry="14"/>
  </g>
  <g fill="#b9a690">
    <ellipse cx="124" cy="30" rx="10" ry="5"/><ellipse cx="342" cy="16" rx="12" ry="5"/>
    <ellipse cx="466" cy="16" rx="10" ry="4"/><ellipse cx="574" cy="30" rx="11" ry="5"/>
    <ellipse cx="40" cy="96" rx="6" ry="12"/><ellipse cx="660" cy="190" rx="6" ry="12"/>
  </g>
  <!-- вода -->
  <rect x="32" y="32" width="636" height="226" rx="104" fill="#5fbccb"/>
  <rect x="34" y="40" width="632" height="210" rx="100" fill="#7fd3dd"/>
  <!-- светлая полоса у дальнего края -->
  <path d="M120 54 C240 46 460 46 580 54 C560 64 460 70 350 70 C240 70 140 64 120 54 Z" fill="#a7e4ea" opacity="0.8"/>
  <!-- рябь -->
  <g fill="none" stroke="#c6f1f4" stroke-linecap="round">
    <path d="M90 120 Q120 128 150 120" stroke-width="5"/>
    <path d="M560 112 Q590 120 620 112" stroke-width="5"/>
    <path d="M70 190 Q110 200 150 190" stroke-width="5"/>
    <path d="M552 196 Q590 206 628 196" stroke-width="5"/>
    <path d="M180 226 Q220 234 260 226" stroke-width="4"/>
    <path d="M440 228 Q480 236 520 228" stroke-width="4"/>
    <path d="M118 158 Q132 162 146 158" stroke-width="3"/>
    <path d="M560 154 Q574 158 588 154" stroke-width="3"/>
  </g>
  <!-- блики -->
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="200" cy="96" rx="14" ry="4"/><ellipse cx="510" cy="88" rx="12" ry="3.5"/>
    <ellipse cx="96" cy="230" rx="10" ry="3"/><ellipse cx="610" cy="232" rx="10" ry="3"/>
  </g>
  <!-- ближний бортик (чуть темнее) -->
  <path d="M34 214 C70 262 150 276 230 276 H470 C550 276 630 262 666 214 C660 250 600 286 470 286 H230 C100 286 40 250 34 214 Z" fill="#a8937c"/>
</svg>
